const main = document.getElementById('main');
const dots = document.getElementById('dots');
let cur = 0;

function render() {
    main.innerHTML = '';
    const d = slides[cur];
    let html = '';
    
    if (d.type === 'cover') {
        html = `<div class="slide cover active"><div class="cover-text"><h1 class="title">${d.title}</h1><p class="subtitle">${d.sub}</p></div></div>`;
    } else {
        html = `<div class="slide active"><div class="banner ${d.banner.includes('GRAMMAR') ? 'grammar' : 'vocab'}">${d.banner}</div><h2>${d.title}</h2><p class="inst">${d.inst}</p>`;
        if (d.content) {
            html += d.content;
        }
        if (d.items) {
            d.items.forEach((it, i) => {
                html += `<div class="item"><div>${it.q}</div>`;
                if (it.a) html += `<input class="input" data-ans="${it.a}">`;
                html += `</div>`;
            });
            if (d.items.some(i => i.a)) html += `<button class="btn" onclick="chk(${cur})">Check</button>`;
        }
        html += '</div>';
    }
    
    main.innerHTML = html;
    document.getElementById('cur').textContent = cur + 1;
    document.getElementById('home').style.display = cur === 0 ? 'none' : 'block';
    updateDots();
}

function chk(n) {
    const slide = main.querySelector('.slide');
    slide.querySelectorAll('.input').forEach(inp => {
        const v = inp.value.trim().toLowerCase();
        const a = inp.dataset.ans.toLowerCase();
        inp.classList.remove('empty', 'ok', 'bad');
        if (!v) inp.classList.add('empty');
        else inp.classList.add(v === a ? 'ok' : 'bad');
    });
}

function updateDots() {
    dots.innerHTML = '';
    for (let i = 0; i < slides.length; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === cur ? ' on' : '');
        d.onclick = () => go(i);
        dots.appendChild(d);
    }
}

function next() { if (cur < slides.length - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }
function go(n) { cur = n; render(); }

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
});

render();
    </script>
</body>
</html>
